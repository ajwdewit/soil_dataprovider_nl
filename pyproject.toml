[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "soil_dataprovider_nl"
version = "1.0.0"
authors = [
  { name="Allard de Wit", email="allard.dewit@wur.nl" },
]
maintainers = [
  { name="Allard de Wit", email="allard.dewit@wur.nl" },
]
description = "This package provides a set of data providers that can derive the soil parameters for running crop/soil models in PCSE based on the Dutch soil map."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pyproj==3.7",
    "matplotlib",
    "duckdb == 1.4"
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: EUPL License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ajwdewit/soil_dataprovider_nl"
documentation = "https://github.com/ajwdewit/soil_dataprovider_nl"
repository = "https://github.com/ajwdewit/soil_dataprovider_nl"
